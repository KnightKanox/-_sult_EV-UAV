<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="002、210、310、320 四版本指标柱状图">
  <style>
    .title{font:700 24px sans-serif;fill:#111827}.subtitle{font:14px sans-serif;fill:#4b5563}.axis{stroke:#374151;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.tick{font:12px sans-serif;fill:#4b5563}.label{font:13px sans-serif;fill:#111827}.value{font:12px sans-serif;fill:#111827}.legend{font:13px sans-serif;fill:#111827}.note{font:13px sans-serif;fill:#b45309}.v002{fill:#60a5fa}.v210{fill:#34d399}.v310{fill:#f59e0b}.v320{fill:#f87171}
  </style>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" class="title">002、210、310、320 四版本验证指标对比</text>
  <text x="600" y="62" text-anchor="middle" class="subtitle">IoU、seg_acc、PD 越高越好；FA 越低越好</text>

  <g transform="translate(82,96)">
    <line x1="0" y1="480" x2="1030" y2="480" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="480" class="axis"/>
    <g class="tick">
      <line x1="0" y1="480" x2="1030" y2="480" class="grid"/><text x="-12" y="484" text-anchor="end">0.0</text>
      <line x1="0" y1="384" x2="1030" y2="384" class="grid"/><text x="-12" y="388" text-anchor="end">0.2</text>
      <line x1="0" y1="288" x2="1030" y2="288" class="grid"/><text x="-12" y="292" text-anchor="end">0.4</text>
      <line x1="0" y1="192" x2="1030" y2="192" class="grid"/><text x="-12" y="196" text-anchor="end">0.6</text>
      <line x1="0" y1="96" x2="1030" y2="96" class="grid"/><text x="-12" y="100" text-anchor="end">0.8</text>
      <line x1="0" y1="0" x2="1030" y2="0" class="grid"/><text x="-12" y="4" text-anchor="end">1.0</text>
    </g>

    <g transform="translate(70,0)">
      <rect x="0" y="311.467" width="34" height="168.533" class="v002"/><text x="17" y="304" text-anchor="middle" class="value">0.351</text>
      <rect x="42" y="166.606" width="34" height="313.394" class="v210"/><text x="59" y="159" text-anchor="middle" class="value">0.653</text>
      <rect x="84" y="217.643" width="34" height="262.357" class="v310"/><text x="101" y="210" text-anchor="middle" class="value">0.547</text>
      <rect x="126" y="473.866" width="34" height="6.134" class="v320"/><text x="143" y="466" text-anchor="middle" class="value">0.013</text>
      <text x="80" y="520" text-anchor="middle" class="label">IoU</text>
    </g>
    <g transform="translate(310,0)">
      <rect x="0" y="139.187" width="34" height="340.813" class="v002"/><text x="17" y="132" text-anchor="middle" class="value">0.710</text>
      <rect x="42" y="91.126" width="34" height="388.874" class="v210"/><text x="59" y="84" text-anchor="middle" class="value">0.810</text>
      <rect x="84" y="78.530" width="34" height="401.470" class="v310"/><text x="101" y="71" text-anchor="middle" class="value">0.836</text>
      <rect x="126" y="468.254" width="34" height="11.746" class="v320"/><text x="143" y="461" text-anchor="middle" class="value">0.024</text>
      <text x="80" y="520" text-anchor="middle" class="label">seg_acc</text>
    </g>
    <g transform="translate(550,0)">
      <rect x="0" y="97.774" width="34" height="382.226" class="v002"/><text x="17" y="90" text-anchor="middle" class="value">0.796</text>
      <rect x="42" y="65.821" width="34" height="414.179" class="v210"/><text x="59" y="58" text-anchor="middle" class="value">0.863</text>
      <rect x="84" y="72.877" width="34" height="407.123" class="v310"/><text x="101" y="65" text-anchor="middle" class="value">0.848</text>
      <rect x="126" y="425.872" width="34" height="54.128" class="v320"/><text x="143" y="418" text-anchor="middle" class="value">0.113</text>
      <text x="80" y="520" text-anchor="middle" class="label">PD</text>
    </g>
    <g transform="translate(790,0)">
      <rect x="0" y="478.725" width="34" height="1.275" class="v002"/><text x="17" y="470" text-anchor="middle" class="value">0.001275</text>
      <rect x="42" y="479.891" width="34" height="0.109" class="v210"/><text x="59" y="462" text-anchor="middle" class="value">0.000109</text>
      <rect x="84" y="479.190" width="34" height="0.810" class="v310"/><text x="101" y="470" text-anchor="middle" class="value">0.000810</text>
      <rect x="126" y="478.843" width="34" height="1.157" class="v320"/><text x="143" y="470" text-anchor="middle" class="value">0.001157</text>
      <text x="80" y="520" text-anchor="middle" class="label">FA</text>
    </g>
  </g>

  <g transform="translate(185,660)">
    <rect x="0" y="-12" width="16" height="16" class="v002"/><text x="22" y="1" class="legend">v0.0.2 / 002</text>
    <rect x="180" y="-12" width="16" height="16" class="v210"/><text x="202" y="1" class="legend">v2.1.0 / 210</text>
    <rect x="360" y="-12" width="16" height="16" class="v310"/><text x="382" y="1" class="legend">v3.1.0 / 310</text>
    <rect x="540" y="-12" width="16" height="16" class="v320"/><text x="562" y="1" class="legend">v3.2.0 / 320</text>
    <text x="745" y="1" class="note">注：FA 使用原始值绘制，数值越低越好。</text>
  </g>
</svg>
