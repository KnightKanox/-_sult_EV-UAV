STRUCTURE:
  model_name: evissgnet
  width: 12
  block_residual: true
  block_reps: 2
  use_coords: true
DATA:
  input_channel: 8
  root: /root/EV-UAV-dataset
  whole_t: 8000
  res:
  - 346
  - 260
TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.001
  k: 3
  t: 5
  max_events_num: 50000
  seed: 316
  model_save_root: /root/EV-UAV/log/versions/v3.1.3-no-patchattention/models
TEST:
  vis: false
  eval: true
  roc: true
  pd_detT: 50
  correct_thresh: 0.0001
  save: true
  model_path: /root/EV-UAV/log/versions/v3.1.3-no-patchattention/models/best_iou_seed316.pt
EXPERIMENT:
  version: v3.1.3
  ablation: no_patchattention
  experiment_root: /root/EV-UAV/log/versions/v3.1.3-no-patchattention
  runtime_experiment_root: /root/EV-UAV/log/versions/v3.1.3-no-patchattention
  results_dir: /root/EV-UAV/log/versions/v3.1.3-no-patchattention/results
  models_dir: /root/EV-UAV/log/versions/v3.1.3-no-patchattention/models
  submission_dir: /root/EV-UAV/log/versions/v3.1.3-no-patchattention/submission
  cache_dir: /root/EV-UAV/log/versions/v3.1.3-no-patchattention/cache
  charts_dir: /root/EV-UAV/log/versions/v3.1.3-no-patchattention/charts
V3_FEATURES:
  feature_k: 32
  feature_radius: 0.035
  density_sigma: 0.018
  linearity_d0: 12.0
  temporal_tau: 0.02
  negative_slope: 0.01
