STRUCTURE:
  model_name: evissgnet
  width: 12
  block_residual: true
  block_reps: 2
  use_coords: true
DATA:
  input_channel: 4
  root: /root/EV-UAV-dataset
  whole_t: 8000
  res:
  - 346
  - 260
TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.001
  k: 3
  t: 7
  max_events_num: 20000
  model_save_root: /root/EV-UAV/log/versions/v2.1.0-v002-improvement-suite/models/v002_stc_t7
TEST:
  vis: false
  eval: true
  roc: true
  pd_detT: 50
  correct_thresh: 0.0001
  save: true
  model_path: /root/EV-UAV/log/versions/v2.1.0-v002-improvement-suite/models/v002_stc_t7/best_iou_seed37.pt
