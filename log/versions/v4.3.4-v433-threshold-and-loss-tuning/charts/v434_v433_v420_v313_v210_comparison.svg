<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #5f6368; }
    .panel-title { font-size: 16px; font-weight: 700; }
    .label { font-size: 12px; }
    .value { font-size: 12px; fill: #3c4043; }
    .axis { stroke: #dadce0; stroke-width: 1; }
  </style>
  <text x="40" y="38" class="title">v4.3.4 Threshold Tuning Comparison</text>
  <text x="40" y="62" class="subtitle">v4.3.4 reuses v4.3.3 best-IoU weights; @0.85 maximizes IoU, @0.92 is the validated low-FA recommendation.</text>

  <g transform="translate(40,95)">
    <text x="0" y="0" class="panel-title">IoU (higher is better)</text>
    <line x1="0" y1="180" x2="1120" y2="180" class="axis"/>
    <rect x="20" y="55" width="105" height="125" fill="#2563eb"/><text x="20" y="198" class="label">v4.3.4@0.85</text><text x="20" y="46" class="value">0.746950</text>
    <rect x="190" y="57" width="105" height="123" fill="#0f766e"/><text x="190" y="198" class="label">v4.3.4@0.92</text><text x="190" y="48" class="value">0.740445</text>
    <rect x="360" y="56" width="105" height="124" fill="#7c3aed"/><text x="360" y="198" class="label">v4.3.3</text><text x="360" y="47" class="value">0.745085</text>
    <rect x="530" y="82" width="105" height="98" fill="#f59e0b"/><text x="530" y="198" class="label">v4.2.0</text><text x="530" y="73" class="value">0.590623</text>
    <rect x="700" y="61" width="105" height="119" fill="#db2777"/><text x="700" y="198" class="label">v3.1.3</text><text x="700" y="52" class="value">0.717086</text>
    <rect x="870" y="71" width="105" height="109" fill="#64748b"/><text x="870" y="198" class="label">v2.1.0</text><text x="870" y="62" class="value">0.652904</text>
  </g>

  <g transform="translate(40,330)">
    <text x="0" y="0" class="panel-title">seg_acc and PD (higher is better)</text>
    <line x1="0" y1="145" x2="1120" y2="145" class="axis"/>
    <text x="20" y="167" class="label">seg_acc</text>
    <rect x="90" y="15" width="96" height="130" fill="#2563eb"/><text x="90" y="10" class="value">0.867386</text>
    <rect x="230" y="20" width="96" height="125" fill="#0f766e"/><text x="230" y="15" class="value">0.832840</text>
    <rect x="370" y="18" width="96" height="127" fill="#7c3aed"/><text x="370" y="13" class="value">0.846442</text>
    <rect x="510" y="12" width="96" height="133" fill="#f59e0b"/><text x="510" y="7" class="value">0.888621</text>
    <rect x="650" y="24" width="96" height="121" fill="#db2777"/><text x="650" y="19" class="value">0.807605</text>
    <rect x="790" y="23" width="96" height="122" fill="#64748b"/><text x="790" y="18" class="value">0.810155</text>

    <line x1="0" y1="300" x2="1120" y2="300" class="axis"/>
    <text x="20" y="322" class="label">PD</text>
    <rect x="90" y="174" width="96" height="126" fill="#2563eb"/><text x="90" y="169" class="value">0.843553</text>
    <rect x="230" y="180" width="96" height="120" fill="#0f766e"/><text x="230" y="175" class="value">0.798824</text>
    <rect x="370" y="178" width="96" height="122" fill="#7c3aed"/><text x="370" y="173" class="value">0.815204</text>
    <rect x="510" y="170" width="96" height="130" fill="#f59e0b"/><text x="510" y="165" class="value">0.863923</text>
    <rect x="650" y="179" width="96" height="121" fill="#db2777"/><text x="650" y="174" class="value">0.809744</text>
    <rect x="790" y="171" width="96" height="129" fill="#64748b"/><text x="790" y="166" class="value">0.862873</text>
  </g>

  <g transform="translate(40,655)">
    <text x="0" y="0" class="panel-title">FA (lower is better)</text>
    <rect x="160" y="-26" width="170" height="16" fill="#2563eb"/><text x="335" y="-13" class="value">v4.3.4@0.85 0.000340180</text>
    <rect x="160" y="-2" width="102" height="16" fill="#0f766e"/><text x="267" y="11" class="value">v4.3.4@0.92 0.000205105</text>
    <rect x="510" y="-26" width="121" height="16" fill="#7c3aed"/><text x="636" y="-13" class="value">v4.3.3 0.000242174</text>
    <rect x="510" y="-2" width="92" height="16" fill="#f59e0b"/><text x="607" y="11" class="value">v4.2.0 0.000183975</text>
    <rect x="800" y="-26" width="76" height="16" fill="#db2777"/><text x="881" y="-13" class="value">v3.1.3 0.000152564</text>
    <rect x="800" y="-2" width="54" height="16" fill="#64748b"/><text x="859" y="11" class="value">v2.1.0 0.000108761</text>
  </g>
</svg>
