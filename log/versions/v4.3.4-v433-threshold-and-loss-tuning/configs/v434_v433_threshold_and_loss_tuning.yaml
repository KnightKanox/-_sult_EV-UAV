STRUCTURE:
  model_name: v433_threshold_and_loss_tuning
  input_channel: 8
  stem_channels: 24
  stage2_channels: 40
  stage3_channels: 64
  bottleneck_channels: 96
  downsample_strides:
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 4
  no_patchattention: true
  activation: LeakyReLU
  bottleneck_direction_aggregation: true
  v433_threshold_and_loss_tuning: true
  direction_head_hidden: 128
  direction_neighbor_k: 16
DATA:
  root: /root/EV-UAV-dataset
  whole_t: 8000
  res:
  - 346
  - 260
TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.001
  k: 3
  t: 5
  max_events_num: 50000
  seed: 316
  model_save_root: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning/models
  trajectory_projection_dice_weight: 0.3
  trajectory_projection_dice_mode: xy_mean_projection_dice_train_only
  trajectory_direction_weight: 0.2
  auxiliary_supervision: xy_mean_projection_dice_train_only+direction_head
TEST:
  vis: false
  eval: true
  roc: true
  pd_detT: 50
  correct_thresh: 0.0001
  save: true
  model_path: /root/EV-UAV/log/versions/v4.3.3-trajectory-direction-head/models/best_iou_seed316.pt
EXPERIMENT:
  version: v4.3.4
  experiment: v433_threshold_and_loss_tuning
  experiment_root: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning
  runtime_experiment_root: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning
  results_dir: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning/results
  models_dir: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning/models
  submission_dir: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning/submission
  cache_dir: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning/cache
  charts_dir: /root/EV-UAV/log/versions/v4.3.4-v433-threshold-and-loss-tuning/charts
V3_FEATURES_REUSED:
  feature_k: 32
  feature_radius: 0.035
  density_sigma: 0.018
  linearity_d0: 12.0
  temporal_tau: 0.02
  negative_slope: 0.01

V4_3_4_THRESHOLD_TUNING:
  source_version: v4.3.3
  source_weight: /root/EV-UAV/log/versions/v4.3.3-trajectory-direction-head/models/best_iou_seed316.pt
  thresholds:
  - 0.70
  - 0.75
  - 0.80
  - 0.85
  - 0.90
  - 0.92
  - 0.94
  - 0.95
  - 0.97
  loss_ablation_policy: skip_if_threshold_scan_finds_clear_working_point
