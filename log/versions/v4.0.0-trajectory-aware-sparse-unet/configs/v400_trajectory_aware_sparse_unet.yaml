  input_channel: 8
  stem_channels: 24
  stage2_channels: 40
  stage3_channels: 64
  bottleneck_channels: 96
  downsample_strides:
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 4
  no_patchattention: true
  activation: LeakyReLU
DATA:
