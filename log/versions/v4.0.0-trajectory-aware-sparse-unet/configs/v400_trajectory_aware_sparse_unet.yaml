  results_dir: /root/EV-UAV/log/versions/v4.0.0-trajectory-aware-sparse-unet/results
  models_dir: /root/EV-UAV/log/versions/v4.0.0-trajectory-aware-sparse-unet/models
  submission_dir: /root/EV-UAV/log/versions/v4.0.0-trajectory-aware-sparse-unet/submission
  cache_dir: /root/EV-UAV/log/versions/v4.0.0-trajectory-aware-sparse-unet/cache
