<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <style>
    .title { font: 700 24px sans-serif; fill: #1f2937; }
    .subtitle { font: 14px sans-serif; fill: #4b5563; }
    .panel-title { font: 700 16px sans-serif; fill: #111827; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .label { font: 12px sans-serif; fill: #374151; }
    .value { font: 11px sans-serif; fill: #111827; }
    .note { font: 13px sans-serif; fill: #374151; }
  </style>
  <rect width="1180" height="760" fill="#ffffff"/>
  <text x="40" y="40" class="title">002 / 210 / 310 / 330 验证指标对比</text>
  <text x="40" y="64" class="subtitle">IoU、seg_acc、PD 越高越好；FA 越低越好。330 AdamW：IoU 较 310 略升，但 seg_acc/PD 略降、FA 略高；综合仍未超过 210。</text>

  <rect x="40" y="86" width="18" height="18" fill="#9ca3af"/><text x="66" y="100" class="label">v0.0.2 / 002</text>
  <rect x="190" y="86" width="18" height="18" fill="#2563eb"/><text x="216" y="100" class="label">v2.1.0 / 210</text>
  <rect x="350" y="86" width="18" height="18" fill="#16a34a"/><text x="376" y="100" class="label">v3.1.0 / 310</text>
  <rect x="510" y="86" width="18" height="18" fill="#dc2626"/><text x="536" y="100" class="label">v3.3.0 / 330</text>

  <!-- IoU panel, max 0.70 -->
  <g transform="translate(40,135)">
    <text x="0" y="0" class="panel-title">IoU</text>
    <line x1="0" y1="220" x2="500" y2="220" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="220" class="axis"/>
    <line x1="0" y1="62.9" x2="500" y2="62.9" class="grid"/><text x="-4" y="66" text-anchor="end" class="label">0.50</text>
    <line x1="0" y1="141.4" x2="500" y2="141.4" class="grid"/><text x="-4" y="145" text-anchor="end" class="label">0.25</text>
    <rect x="65" y="109.7" width="70" height="110.3" fill="#9ca3af"/><text x="100" y="104" text-anchor="middle" class="value">0.351111</text>
    <rect x="165" y="14.8" width="70" height="205.2" fill="#2563eb"/><text x="200" y="9" text-anchor="middle" class="value">0.652904</text>
    <rect x="265" y="48.2" width="70" height="171.8" fill="#16a34a"/><text x="300" y="43" text-anchor="middle" class="value">0.546578</text>
    <rect x="365" y="42.7" width="70" height="177.3" fill="#dc2626"/><text x="400" y="37" text-anchor="middle" class="value">0.564238</text>
    <text x="100" y="240" text-anchor="middle" class="label">002</text><text x="200" y="240" text-anchor="middle" class="label">210</text><text x="300" y="240" text-anchor="middle" class="label">310</text><text x="400" y="240" text-anchor="middle" class="label">330</text>
  </g>

  <!-- seg_acc panel, max 0.90 -->
  <g transform="translate(620,135)">
    <text x="0" y="0" class="panel-title">seg_acc</text>
    <line x1="0" y1="220" x2="500" y2="220" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="220" class="axis"/>
    <line x1="0" y1="97.8" x2="500" y2="97.8" class="grid"/><text x="-4" y="101" text-anchor="end" class="label">0.50</text>
    <line x1="0" y1="36.7" x2="500" y2="36.7" class="grid"/><text x="-4" y="40" text-anchor="end" class="label">0.75</text>
    <rect x="65" y="46.4" width="70" height="173.6" fill="#9ca3af"/><text x="100" y="41" text-anchor="middle" class="value">0.710027</text>
    <rect x="165" y="22.0" width="70" height="198.0" fill="#2563eb"/><text x="200" y="17" text-anchor="middle" class="value">0.810155</text>
    <rect x="265" y="15.6" width="70" height="204.4" fill="#16a34a"/><text x="300" y="10" text-anchor="middle" class="value">0.836397</text>
    <rect x="365" y="18.0" width="70" height="202.0" fill="#dc2626"/><text x="400" y="13" text-anchor="middle" class="value">0.826321</text>
    <text x="100" y="240" text-anchor="middle" class="label">002</text><text x="200" y="240" text-anchor="middle" class="label">210</text><text x="300" y="240" text-anchor="middle" class="label">310</text><text x="400" y="240" text-anchor="middle" class="label">330</text>
  </g>

  <!-- PD panel, max 0.90 -->
  <g transform="translate(40,455)">
    <text x="0" y="0" class="panel-title">PD</text>
    <line x1="0" y1="220" x2="500" y2="220" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="220" class="axis"/>
    <line x1="0" y1="97.8" x2="500" y2="97.8" class="grid"/><text x="-4" y="101" text-anchor="end" class="label">0.50</text>
    <line x1="0" y1="36.7" x2="500" y2="36.7" class="grid"/><text x="-4" y="40" text-anchor="end" class="label">0.75</text>
    <rect x="65" y="25.3" width="70" height="194.7" fill="#9ca3af"/><text x="100" y="20" text-anchor="middle" class="value">0.796304</text>
    <rect x="165" y="9.1" width="70" height="210.9" fill="#2563eb"/><text x="200" y="4" text-anchor="middle" class="value">0.862873</text>
    <rect x="265" y="12.7" width="70" height="207.3" fill="#16a34a"/><text x="300" y="8" text-anchor="middle" class="value">0.848173</text>
    <rect x="365" y="15.0" width="70" height="205.0" fill="#dc2626"/><text x="400" y="10" text-anchor="middle" class="value">0.838723</text>
    <text x="100" y="240" text-anchor="middle" class="label">002</text><text x="200" y="240" text-anchor="middle" class="label">210</text><text x="300" y="240" text-anchor="middle" class="label">310</text><text x="400" y="240" text-anchor="middle" class="label">330</text>
  </g>

  <!-- FA panel, max 0.00130, lower is better -->
  <g transform="translate(620,455)">
    <text x="0" y="0" class="panel-title">FA（越低越好）</text>
    <line x1="0" y1="220" x2="500" y2="220" class="axis"/>
    <line x1="0" y1="0" x2="0" y2="220" class="axis"/>
    <line x1="0" y1="50.8" x2="500" y2="50.8" class="grid"/><text x="-4" y="54" text-anchor="end" class="label">0.0010</text>
    <line x1="0" y1="135.4" x2="500" y2="135.4" class="grid"/><text x="-4" y="139" text-anchor="end" class="label">0.0005</text>
    <rect x="65" y="4.2" width="70" height="215.8" fill="#9ca3af"/><text x="100" y="0" text-anchor="middle" class="value">0.001275000</text>
    <rect x="165" y="201.6" width="70" height="18.4" fill="#2563eb"/><text x="200" y="197" text-anchor="middle" class="value">0.000108761</text>
    <rect x="265" y="82.8" width="70" height="137.2" fill="#16a34a"/><text x="300" y="78" text-anchor="middle" class="value">0.000810464</text>
    <rect x="365" y="82.1" width="70" height="137.9" fill="#dc2626"/><text x="400" y="77" text-anchor="middle" class="value">0.000814464</text>
    <text x="100" y="240" text-anchor="middle" class="label">002</text><text x="200" y="240" text-anchor="middle" class="label">210</text><text x="300" y="240" text-anchor="middle" class="label">310</text><text x="400" y="240" text-anchor="middle" class="label">330</text>
  </g>

  <text x="40" y="735" class="note">最优：IoU/PD/FA 为 v2.1.0；seg_acc 为 v3.1.0。v3.3.0 相比 v2.1.0：IoU -0.088667，PD -0.024150，FA +0.000705703，仅 seg_acc +0.016166。</text>
</svg>
