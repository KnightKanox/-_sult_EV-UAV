STRUCTURE:
  model_name: trajectory_direction_head
  input_channel: 8
  stem_channels: 24
  stage2_channels: 40
  stage3_channels: 64
  bottleneck_channels: 96
  downsample_strides:
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 4
  no_patchattention: true
  activation: LeakyReLU
  bottleneck_direction_aggregation: true
  trajectory_direction_head: true
  direction_head_hidden: 128
  direction_neighbor_k: 16
DATA:
  root: /root/EV-UAV-dataset
  whole_t: 8000
  res:
  - 346
  - 260
TRAIN:
  epochs: 50
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.001
  k: 3
  t: 5
  max_events_num: 50000
  seed: 316
  model_save_root: /root/EV-UAV/log/versions/v4.5.0-input-normalization/models
  trajectory_projection_dice_weight: 0.3
  trajectory_projection_dice_mode: xy_mean_projection_dice_train_only
  trajectory_direction_weight: 0.2
  auxiliary_supervision: xy_mean_projection_dice_train_only+direction_head
TEST:
  vis: false
  eval: true
  roc: true
  pd_detT: 50
  correct_thresh: 0.0001
  save: true
  model_path: /root/EV-UAV/log/versions/v4.5.0-input-normalization/models/best_iou_seed316.pt
EXPERIMENT:
  version: v4.5.0
  experiment: trajectory_direction_head
  experiment_root: /root/EV-UAV/log/versions/v4.5.0-input-normalization
  runtime_experiment_root: /root/EV-UAV/log/versions/v4.5.0-input-normalization
  results_dir: /root/EV-UAV/log/versions/v4.5.0-input-normalization/results
  models_dir: /root/EV-UAV/log/versions/v4.5.0-input-normalization/models
  submission_dir: /root/EV-UAV/log/versions/v4.5.0-input-normalization/submission
  cache_dir: /root/EV-UAV/log/versions/v4.5.0-input-normalization/cache
  charts_dir: /root/EV-UAV/log/versions/v4.5.0-input-normalization/charts
  input_stats_filename: v450_input_stats.json
INPUT_NORMALIZATION:
  enabled: true
  stats_source_split: train
  input_norm_epsilon: 1.0e-06
  input_norm_clip: false
  input_norm_stats_path: /root/EV-UAV/log/versions/v4.5.0-input-normalization/cache/v450_input_stats.json
  channels:
  - x
  - y
  - t
  - p
  - d
  - L_star
  - C
  - T
V3_FEATURES_REUSED:
  feature_k: 32
  feature_radius: 0.035
  density_sigma: 0.018
  linearity_d0: 12.0
  temporal_tau: 0.02
  negative_slope: 0.01
