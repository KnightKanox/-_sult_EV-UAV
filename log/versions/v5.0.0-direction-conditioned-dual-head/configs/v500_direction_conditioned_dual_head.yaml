STRUCTURE:
  model_name: direction_conditioned_dual_head
  input_channel: 8
  stem_channels: 24
  stage2_channels: 40
  stage3_channels: 64
  bottleneck_channels: 96
  downsample_strides:
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 2
  - - 2
    - 2
    - 4
  no_patchattention: true
  activation: LeakyReLU
  bottleneck_direction_aggregation: true
  local_direction_neighborhood:
    dx: 1
    dy: 1
    dt: 2
    max_neighbors: 44
  trajectory_direction_head: true
  direction_head_hidden: 128
  direction_neighbor_k: 16
  direction_confidence_head: true
DATA:
  root: /root/EV-UAV-dataset
  whole_t: 8000
  res:
  - 346
  - 260
TRAIN:
  epochs: 1
  batch_size: 1
  train_workers: 8
  optim: Adam
  lr: 0.001
  k: 3
  t: 5
  max_events_num: 50000
  seed: 316
  model_save_root: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head/models
  trajectory_projection_dice_weight: 0.3
  trajectory_projection_dice_mode: xy_mean_projection_dice_train_only
  trajectory_direction_weight: 0.1
  initial_loss: L_main + 0.3*L_traj + 0.1*L_dir
  direction_loss_components: abs_cosine + 0.5*confidence_bce + 0.5*confidence_mse
  auxiliary_supervision: xy_mean_projection_dice_train_only+direction_confidence_head
TEST:
  vis: false
  eval: true
  roc: true
  pd_detT: 50
  correct_thresh: 0.0001
  save: true
  model_path: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head/models/best_iou_seed316.pt
EXPERIMENT:
  version: v5.0.0
  experiment: direction_conditioned_dual_head
  experiment_root: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head
  runtime_experiment_root: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head
  results_dir: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head/results
  models_dir: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head/models
  submission_dir: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head/submission
  cache_dir: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head/cache
  charts_dir: /root/EV-UAV/log/versions/v5.0.0-direction-conditioned-dual-head/charts
  chunked_inference: true
  inference_chunk_size: 50000
V3_FEATURES_REUSED:
  feature_k: 32
  feature_radius: 0.035
  density_sigma: 0.018
  linearity_d0: 12.0
  temporal_tau: 0.02
  negative_slope: 0.01
